<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 64">
  <g stroke="#110a0a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- Huge hunched back body -->
    <path d="M10 24 C 6 36, 12 50, 14 54 C 20 58, 34 56, 36 50 C 40 40, 34 24, 28 20 Z" fill="#301b1b" stroke-width="4" />
    <!-- Scratchy fur on body -->
    <path d="M10 30 L 6 34 M 10 38 L 4 40 M 12 46 L 8 50 M 34 30 L 40 32 M 36 40 L 42 42" stroke-width="2" />
    <!-- Legs -->
    <path d="M14 54 C 10 60, 16 62, 14 64" />
    <path d="M34 54 C 38 60, 32 62, 34 64" />
    <path d="M10 64 L 18 64 M 30 64 L 38 64" /> <!-- Claws -->
    <!-- Arms/Claws -->
    <path d="M12 32 C 4 38, 2 48, 8 54 M 8 54 L 4 56 M 8 54 L 10 58 M 8 54 L 12 56" />
    <path d="M34 32 C 42 38, 44 48, 38 54 M 38 54 L 42 56 M 38 54 L 36 58 M 38 54 L 34 56" />
    <!-- Head -->
    <path d="M14 16 C 10 4, 30 0, 36 10 C 40 18, 32 26, 24 26 C 18 26, 16 22, 14 16 Z" fill="#211010" />
    <!-- Ears -->
    <path d="M16 10 L 10 2 L 20 6" fill="#110a0a" />
    <path d="M30 6 L 38 2 L 34 10" fill="#110a0a" />
    <!-- Red glowing eyes (Tim Burton style: big, hollow but with small red pupil) -->
    <circle cx="20" cy="14" r="4" fill="#000" />
    <circle cx="28" cy="14" r="4" fill="#000" />
    <circle cx="20" cy="14" r="1.5" fill="#f22c2c" stroke="none" />
    <circle cx="28" cy="14" r="1.5" fill="#f22c2c" stroke="none" />
    <circle cx="20" cy="14" r="2.5" fill="none" stroke="#f22c2c" stroke-width="0.5" />
    <circle cx="28" cy="14" r="2.5" fill="none" stroke="#f22c2c" stroke-width="0.5" />
    <!-- Scary jagged teeth -->
    <path d="M18 22 L 20 20 L 22 22 L 24 20 L 26 22 L 28 20 L 30 22" stroke-width="1.5" />
  </g>
</svg>
