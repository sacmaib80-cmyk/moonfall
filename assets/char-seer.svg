<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 64">
  <g stroke="#1a1a1a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- Robe / Cloak -->
    <path d="M16 26 C 8 36, 10 50, 12 58 C 18 62, 30 62, 36 58 C 38 50, 40 36, 32 26 Z" fill="#2b3147" stroke-width="3" />
    <!-- Tattered bottom -->
    <path d="M12 58 L 16 54 L 20 58 L 24 54 L 28 58 L 32 54 L 36 58" />
    <!-- Aura/smoke at the bottom instead of feet -->
    <path d="M10 60 C 14 66, 20 62, 24 64 C 28 62, 34 66, 38 60" stroke="#6a7bd8" stroke-width="2" />
    <path d="M8 56 C 4 60, 16 64, 20 62" stroke="#6a7bd8" stroke-width="1" />
    <!-- Head / Hood -->
    <path d="M12 18 C 10 6, 24 0, 32 6 C 38 12, 36 24, 28 28 C 22 30, 14 26, 12 18 Z" fill="#1d2130" />
    <!-- Face inside hood (darkness) -->
    <path d="M16 16 C 18 10, 30 10, 32 16 C 34 22, 24 26, 16 16 Z" fill="#0c0d12" stroke="none" />
    <!-- One glowing eye -->
    <circle cx="22" cy="16" r="2.5" fill="#a4b4ff" stroke="none" />
    <!-- Third eye symbol on forehead of hood -->
    <path d="M22 6 L 26 6 L 24 10 Z" fill="#a4b4ff" stroke-width="1" />
    <!-- Arms clutching a small crystal ball -->
    <path d="M16 32 C 14 40, 20 44, 22 44" />
    <path d="M32 32 C 34 40, 28 44, 26 44" />
    <circle cx="24" cy="42" r="4" fill="#6a7bd8" stroke="#1a1a1a" />
    <path d="M22 40 C 24 38, 26 40, 26 40" stroke="#fff" stroke-width="1" />
  </g>
</svg>
